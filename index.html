<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宅ローン繰上返済効果プランナー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-950 text-blue-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-blue-300 mb-1">🏠 住宅ローン繰上返済プランナー</h1>
  <p class="text-center text-blue-700 mb-2 text-sm">繰上返済効果・利息節約・期間短縮を計算</p>
  <div class="bg-blue-900/30 border border-blue-700 rounded-lg p-2 mb-4 text-xs text-blue-300 text-center">
    ⚠️ 免責事項: このツールは試算用です。実際の返済計画は金融機関・ファイナンシャルプランナーにご相談ください。
  </div>

  <!-- Input -->
  <div class="bg-blue-900/40 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-blue-200 mb-3">ローン条件</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-blue-400 block mb-1">借入額（万円）</label>
        <input type="number" id="principal" value="3000" min="100" max="100000" step="100" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-blue-400 block mb-1">年利率（%）</label>
        <input type="number" id="rate" value="1.5" min="0.1" max="10" step="0.1" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-blue-400 block mb-1">返済年数</label>
        <input type="number" id="years" value="35" min="5" max="50" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-blue-400 block mb-1">ローンタイプ</label>
        <select id="loan-type" onchange="calculate()" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white">
          <option value="fixed">固定金利</option>
          <option value="variable">変動金利</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-blue-400 block mb-1">繰上返済額（万円）</label>
        <input type="number" id="prepay" value="100" min="0" max="10000" step="10" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-blue-400 block mb-1">繰上返済タイミング（年目）</label>
        <input type="number" id="prepay-year" value="5" min="1" max="34" class="w-full bg-blue-900 border border-blue-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
    </div>
    <div class="mt-2">
      <label class="text-xs text-blue-400 block mb-1">繰上返済タイプ</label>
      <div class="flex gap-2">
        <label class="flex items-center gap-1 text-xs"><input type="radio" name="prepay-type" value="period" checked onchange="calculate()" class="accent-blue-400"> 期間短縮型</label>
        <label class="flex items-center gap-1 text-xs"><input type="radio" name="prepay-type" value="payment" onchange="calculate()" class="accent-blue-400"> 返済額軽減型</label>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="bg-blue-900/40 rounded-xl p-4 mb-4"></div>

  <!-- Chart -->
  <div class="bg-blue-900/40 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-blue-200 mb-2">月次残高推移チャート</h2>
    <canvas id="balance-chart" width="560" height="160" class="w-full rounded"></canvas>
    <div class="flex gap-4 mt-1 text-xs justify-center">
      <span class="flex items-center gap-1"><span class="inline-block w-4 h-1 bg-blue-400"></span>通常返済</span>
      <span class="flex items-center gap-1"><span class="inline-block w-4 h-1 bg-green-400"></span>繰上返済後</span>
    </div>
  </div>
</div>

<script>
function fmt(n) { return Math.round(n).toLocaleString(); }
function fmtM(n) { return Math.round(n/10000).toLocaleString() + '万円'; }

function calcMonthlyPayment(p, annualRate, months) {
  const r = annualRate / 100 / 12;
  if (r === 0) return p / months;
  return p * r * Math.pow(1+r,months) / (Math.pow(1+r,months)-1);
}

function calcAmortization(principalWan, annualRate, totalMonths, prepayWan, prepayMonth, prepayType) {
  const P = principalWan * 10000;
  const r = annualRate / 100 / 12;
  const mp = calcMonthlyPayment(P, annualRate, totalMonths);

  let normal = [], prepayArr = [];
  let bal = P, balPre = P;
  let normalInterest = 0, prepayInterest = 0;
  let prepayFinished = -1;

  for (let m = 0; m < totalMonths; m++) {
    // Normal
    if (bal > 0) {
      const int = bal * r;
      const prin = mp - int;
      normalInterest += int;
      bal -= prin;
      if (bal < 0) bal = 0;
    }
    normal.push(Math.max(0, bal));

    // Prepay
    if (balPre > 0) {
      const int = balPre * r;
      const prin = mp - int;
      prepayInterest += int;
      balPre -= prin;
      if (balPre < 0) balPre = 0;
      // Apply prepayment at prepay month
      if (m === prepayMonth * 12 - 1 && prepayWan > 0) {
        const prepayAmt = Math.min(prepayWan * 10000, balPre);
        balPre -= prepayAmt;
        if (balPre < 0) balPre = 0;
      }
      if (balPre <= 0 && prepayFinished < 0) prepayFinished = m + 1;
    }
    prepayArr.push(Math.max(0, balPre));
  }

  return {
    normal, prepayArr, normalInterest, prepayInterest,
    prepayFinished: prepayFinished > 0 ? prepayFinished : totalMonths,
    monthlyPayment: mp,
  };
}

function calculate() {
  const P = parseFloat(document.getElementById('principal').value)||3000;
  const rate = parseFloat(document.getElementById('rate').value)||1.5;
  const years = parseInt(document.getElementById('years').value)||35;
  const prepay = parseFloat(document.getElementById('prepay').value)||0;
  const prepayYear = parseInt(document.getElementById('prepay-year').value)||5;
  const prepayType = document.querySelector('input[name="prepay-type"]:checked').value;
  const loanType = document.getElementById('loan-type').value;

  const totalMonths = years * 12;
  const result = calcAmortization(P, rate, totalMonths, prepay, prepayYear, prepayType);

  const monthlyPayment = result.monthlyPayment;
  const normalTotal = monthlyPayment * totalMonths;
  const normalInterest = normalTotal - P * 10000;

  const savedInterest = result.normalInterest - result.prepayInterest;
  const savedMonths = totalMonths - result.prepayFinished;
  const savedYears = Math.floor(savedMonths / 12);
  const savedMo = savedMonths % 12;

  let variableHtml = '';
  if (loanType === 'variable') {
    const scenarios = [
      { label: `${rate}%（現在）`, r: rate },
      { label: `${(rate+0.5).toFixed(1)}%（+0.5%）`, r: rate+0.5 },
      { label: `${(rate+1.0).toFixed(1)}%（+1.0%）`, r: rate+1.0 },
    ];
    variableHtml = `<div class="mt-3 border-t border-blue-700/50 pt-2">
      <div class="text-xs font-semibold text-yellow-400 mb-1">⚡ 変動金利シナリオ比較（金利上昇感度）</div>
      <div class="text-xs text-yellow-600 mb-2">変動金利の計算は入力値を固定率として近似しています。金利変動リスクを以下で確認してください。</div>
      <table class="w-full text-xs text-blue-200"><thead><tr class="text-blue-400"><th class="text-left pb-1">金利シナリオ</th><th class="text-right pb-1">月返済額</th><th class="text-right pb-1">総利息</th><th class="text-right pb-1">節約額</th></tr></thead><tbody>`;
    scenarios.forEach(sc => {
      const r2 = calcAmortization(P, sc.r, totalMonths, prepay, prepayYear, prepayType);
      const mp2 = r2.monthlyPayment;
      const tot2 = mp2 * totalMonths - P * 10000;
      const save2 = r2.normalInterest - r2.prepayInterest;
      variableHtml += `<tr class="${sc.r===rate?'text-white font-semibold':'text-blue-300'}">
        <td class="py-0.5">${sc.label}</td>
        <td class="text-right">${fmt(mp2)}円</td>
        <td class="text-right text-red-300">${fmtM(tot2)}</td>
        <td class="text-right text-green-300">${fmtM(save2)}</td></tr>`;
    });
    variableHtml += `</tbody></table></div>`;
  }

  document.getElementById('results').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3 text-sm">
      <div class="bg-blue-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-blue-400">月々返済額</div>
        <div class="font-bold text-white">${fmt(monthlyPayment)}円</div>
      </div>
      <div class="bg-blue-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-blue-400">総利息（通常）</div>
        <div class="font-bold text-red-300">${fmtM(normalInterest)}</div>
      </div>
      <div class="bg-green-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-green-400">利息節約額</div>
        <div class="font-bold text-green-300">${fmtM(savedInterest)}</div>
      </div>
      <div class="bg-green-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-green-400">期間短縮</div>
        <div class="font-bold text-green-300">${savedYears}年${savedMo}ヶ月</div>
      </div>
    </div>
    <div class="text-xs text-blue-400 space-y-1">
      <div>繰上返済なし: 完済まで<strong class="text-white">${years}年</strong> / 総支払 <strong class="text-red-300">${fmtM(normalTotal)}</strong></div>
      <div>繰上返済後 (${prepayYear}年目に${prepay}万円): 完済まで<strong class="text-white">${Math.floor(result.prepayFinished/12)}年${result.prepayFinished%12}ヶ月</strong> / 総節約 <strong class="text-green-300">${fmtM(savedInterest)}</strong></div>
    </div>
    ${variableHtml}
  `;

  drawChart(result.normal, result.prepayArr, totalMonths);
}

function drawChart(normal, prepay, totalMonths) {
  const canvas = document.getElementById('balance-chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#172554'; ctx.fillRect(0,0,W,H);

  const maxBal = Math.max(...normal, ...prepay, 1);
  const toX = m => 20 + (m/totalMonths)*(W-40);
  const toY = b => H - 20 - (b/maxBal)*(H-40);

  // Grid
  ctx.strokeStyle='#1e3a8a'; ctx.lineWidth=0.5;
  for(let y=0;y<=4;y++) {
    const ly = 20 + y*(H-40)/4;
    ctx.beginPath(); ctx.moveTo(20,ly); ctx.lineTo(W-20,ly); ctx.stroke();
    ctx.fillStyle='#60a5fa'; ctx.font='9px sans-serif'; ctx.textAlign='right';
    ctx.fillText(fmtM(maxBal*(1-y/4)), 18, ly+3);
  }

  // Normal line
  ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
  ctx.beginPath();
  normal.forEach((b,m) => { if(m===0) ctx.moveTo(toX(m),toY(b)); else ctx.lineTo(toX(m),toY(b)); });
  ctx.stroke();

  // Prepay line
  ctx.strokeStyle='#4ade80'; ctx.lineWidth=2;
  ctx.beginPath();
  prepay.forEach((b,m) => { if(m===0) ctx.moveTo(toX(m),toY(b)); else ctx.lineTo(toX(m),toY(b)); });
  ctx.stroke();
}

calculate();
</script>
</body>
</html>
